# zec.ro — partea HTTP (port 80). Instalare: /etc/nginx/conf.d/zec.ro.conf
# Pasul 1 din deploy/README.md: cu acest fișier singur se obține certificatul Let's Encrypt,
# apoi se adaugă zec.ro-ssl.conf (HTTPS).

server_tokens off;

# Limită pentru formulare: ~6 cereri/minut per IP (peste ea, serviciul Node mai aplică propria limită).
limit_req_zone $binary_remote_addr zone=zecro_contact:10m rate=6r/m;

# Orice hostname care nu e zec.ro / www.zec.ro (acces pe IP, domenii strâine îndreptate aici)
# nu primește conținutul site-ului — evită paginile duplicate în index.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name zec.ro www.zec.ro;

    # Validarea certbot (webroot).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://zec.ro$request_uri;
    }
}
