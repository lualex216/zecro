# zec.ro — partea HTTPS (port 443). Instalare: /etc/nginx/conf.d/zec.ro-ssl.conf
# (după ce există certificatul din /etc/letsencrypt/live/zec.ro/). Cere nginx >= 1.25.1 (`http2 on`).
#
# Reguli importante pentru SEO:
#  - fiecare rută e prerandată în dist/, deci NU există fallback la index.html: o rută inexistentă
#    (de ex. un articol încă nepublicat) primește 404 real, nu „soft 404”;
#  - o singură gazdă canonică (zec.ro): www, HTTP și accesul pe IP se redirecționează / se resping;
#  - /x.html și /x/ se redirecționează 301 la /x (ca `cleanUrls` pe Vercel).

# Orice alt hostname pe 443: respinge handshake-ul TLS, fără certificat.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

ssl_certificate     /etc/letsencrypt/live/zec.ro/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/zec.ro/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
ssl_stapling on;
ssl_stapling_verify on;
resolver 1.1.1.1 8.8.8.8 valid=300s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.zec.ro;
    return 301 https://zec.ro$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name zec.ro;

    root /var/www/zecro/current;
    index index.html;
    charset utf-8;

    include snippets/zecro-security-headers.conf;

    # --- Compresie (HTML se comprimă implicit; mai jos restul). Brotli: vezi README (modul opțional).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain application/javascript application/json application/xml
               application/manifest+json image/svg+xml;
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/css text/plain application/javascript application/json application/xml
    #              application/manifest+json image/svg+xml;

    # --- Pagina 404 (status 404 real; dist/404.html e generat la build).
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        include snippets/zecro-security-headers.conf;
    }

    # --- URL-uri curate: /x/ → /x ; /x.html → /x ; /index.html → /
    rewrite ^/(.+)/$ /$1 permanent;
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(.+)\.html$ {
        return 301 /$1;
    }

    # --- Fișiere ascunse (.git, .env etc.), cu excepția /.well-known.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # --- Formularele: către serviciul Node (systemd: zecro-contact).
    location = /api/contact {
        limit_req zone=zecro_contact burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        include snippets/zecro-security-headers.conf;
    }
    location /api/ {
        return 404;
    }

    # --- Pagina principală.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/zecro-security-headers.conf;
    }

    # --- Fișiere cu hash în nume (generate de Vite): cache 1 an, imutabile.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/zecro-security-headers.conf;
    }

    # --- Fonturi, imagini, video, iconițe: fără hash în nume, deci 30 de zile.
    location ~* \.(woff2|webp|jpg|jpeg|png|svg|ico|mp4|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        include snippets/zecro-security-headers.conf;
    }

    # --- Sitemap și robots: mereu revalidate (sitemap-ul se schimbă când apar articole).
    location ~ ^/(sitemap\.xml|robots\.txt)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        include snippets/zecro-security-headers.conf;
    }

    # --- Restul paginilor (HTML prerandat): /blog/x → blog/x.html. Fără fallback la index.html.
    location / {
        try_files $uri $uri.html =404;
        add_header Cache-Control "no-cache" always;
        include snippets/zecro-security-headers.conf;
    }
}
