# Se include în fiecare bloc care are propriile add_header (nginx nu moștenește add_header
# dintr-un nivel superior când blocul curent definește altele).
# Instalare: /etc/nginx/snippets/zecro-security-headers.conf
#
# HSTS: dacă HTTPS-ul abia a fost pus în funcțiune, pornește cu max-age=300, verifică totul,
# apoi crește la 15552000 (6 luni) sau mai mult.
add_header Strict-Transport-Security "max-age=15552000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
